map $http_x_forwarded_proto $yazoo_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:" always;

    set $robots_tag "";
    if ($request_uri ~* "^/(admin|communities|feed|feedback|login|marketplace|messages|notifications|orders|profile|register|reservations|search|settings)(/|\?|$)") {
        set $robots_tag "noindex, nofollow";
    }
    add_header X-Robots-Tag $robots_tag always;

    # Keep cookie authentication and the XSRF double-submit token on one browser
    # origin. BACKEND_UPSTREAM is rendered by the official Nginx entrypoint.
    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $yazoo_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /storage/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $yazoo_forwarded_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/discover/(animals|products|services|veterinarians)/[0-9]+/?$ {
        try_files /discover/$1.html /index.html;
    }

    location / {
        try_files $uri $uri.html /index.html;
    }
}
