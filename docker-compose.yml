services:
  app:
    image: yazoo-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env.docker.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://${LAN_HOST:-localhost}:${APP_PORT:-8000}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FRONTEND_URL: http://${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173}
      SANCTUM_STATEFUL_DOMAINS: ${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173},localhost:${FRONTEND_PORT:-4173},127.0.0.1:${FRONTEND_PORT:-4173},${LAN_HOST:-localhost},localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173},http://localhost:${FRONTEND_PORT:-4173},http://127.0.0.1:${FRONTEND_PORT:-4173}
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      YAZOO_REQUIRE_SCHEDULER_HEARTBEAT: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    image: yazoo-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--backoff=5", "--timeout=90", "--memory=256"]
    env_file:
      - backend/.env.docker.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://${LAN_HOST:-localhost}:${APP_PORT:-8000}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FRONTEND_URL: http://${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173}
      SANCTUM_STATEFUL_DOMAINS: ${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173},localhost:${FRONTEND_PORT:-4173},127.0.0.1:${FRONTEND_PORT:-4173},${LAN_HOST:-localhost},localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173},http://localhost:${FRONTEND_PORT:-4173},http://127.0.0.1:${FRONTEND_PORT:-4173}
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php artisan list --raw >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    image: yazoo-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - backend/.env.docker.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      YAZOO_RUN_SCHEDULER: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  reverb:
    image: yazoo-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - backend/.env.docker.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      # Local-only fallbacks keep Compose reproducible. Azure uses explicit App Settings.
      REVERB_APP_ID: ${REVERB_APP_ID:-yazoo-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-yazoo-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-yazoo-local-secret-change-me}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: http://${LAN_HOST:-localhost}:${FRONTEND_PORT:-4173},http://localhost:${FRONTEND_PORT:-4173}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REVERB_PUBLIC_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8080,$$e,$$m,1); exit(is_resource($$s)?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "0.0.0.0:${APP_PORT:-8000}:80"
    volumes:
      - ./infra/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - backend-storage:/var/www/html/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://nginx
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonar-db:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:?SONAR_DB_NAME is required}
      POSTGRES_USER: ${SONAR_DB_USERNAME:?SONAR_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:?SONAR_DB_NAME is required}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USERNAME:?SONAR_DB_USERNAME is required}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs

volumes:
  backend-storage:
  mysql-data:
  redis-data:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
