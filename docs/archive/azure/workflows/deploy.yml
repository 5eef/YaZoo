name: Legacy Azure deployment (decommissioned)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  required-ci:
    uses: ./.github/workflows/ci.yml
    with:
      build_containers: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    needs: required-ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      BACKEND_WEBAPP: ${{ vars.AZURE_BACKEND_WEBAPP_NAME }}
      FRONTEND_WEBAPP: ${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}
      BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}
      FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
      MYSQL_SERVER: ${{ vars.AZURE_MYSQL_SERVER_NAME }}
      EXPECTED_DB_HOST: ${{ vars.AZURE_DATABASE2_HOST }}
      EXPECTED_DB_PORT: ${{ vars.AZURE_DATABASE2_PORT }}
      EXPECTED_DB_NAME: ${{ vars.AZURE_DATABASE2_NAME }}
      BACKEND_IMAGE: 5eef/yazoo-api:${{ github.sha }}
      FRONTEND_IMAGE: 5eef/yazoo-frontend:${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production ref and SHA
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployment is allowed only from refs/heads/main."
            exit 1
          fi

      - name: Validate guarded DB2 administrator bootstrap secrets
        shell: bash
        env:
          RELEASE_ADMIN_NAME: ${{ secrets.YAZOO_RELEASE_ADMIN_NAME }}
          RELEASE_ADMIN_EMAIL: ${{ secrets.YAZOO_RELEASE_ADMIN_EMAIL }}
          RELEASE_ADMIN_PASSWORD: ${{ secrets.YAZOO_RELEASE_ADMIN_PASSWORD }}
          RELEASE_ADMIN_MFA_SECRET: ${{ secrets.YAZOO_RELEASE_ADMIN_MFA_SECRET }}
          RELEASE_ADMIN_MFA_RECOVERY_CODES: ${{ secrets.YAZOO_RELEASE_ADMIN_MFA_RECOVERY_CODES }}
          DATABASE2_TEST_ACCOUNT_PASSWORD: ${{ secrets.YAZOO_DATABASE2_TEST_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in RELEASE_ADMIN_NAME RELEASE_ADMIN_EMAIL RELEASE_ADMIN_PASSWORD RELEASE_ADMIN_MFA_SECRET RELEASE_ADMIN_MFA_RECOVERY_CODES; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::GitHub production secret ${secret_name} is required for the guarded DB2 administrator bootstrap."
              exit 1
            fi
          done
          if [ -z "$DATABASE2_TEST_ACCOUNT_PASSWORD" ]; then
            echo "::error::YAZOO_DATABASE2_TEST_ACCOUNT_PASSWORD is required for the guarded DATABASE #2 test dataset."
            exit 1
          fi
          if [ "${#DATABASE2_TEST_ACCOUNT_PASSWORD}" -lt 20 ] \
            || ! [[ "$DATABASE2_TEST_ACCOUNT_PASSWORD" =~ [[:lower:]] ]] \
            || ! [[ "$DATABASE2_TEST_ACCOUNT_PASSWORD" =~ [[:upper:]] ]] \
            || ! [[ "$DATABASE2_TEST_ACCOUNT_PASSWORD" =~ [[:digit:]] ]] \
            || [[ "$DATABASE2_TEST_ACCOUNT_PASSWORD" =~ ^[[:alnum:]]+$ ]]; then
            echo "::error::The DATABASE #2 test account password does not satisfy the production policy."
            exit 1
          fi
          if ! [[ "$RELEASE_ADMIN_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::The release administrator email secret is invalid."
            exit 1
          fi
          if [ "${RELEASE_ADMIN_EMAIL,,}" != "bough.youssef@gmail.com" ]; then
            echo "::error::The release administrator must match the administrator in the authorized local test dataset."
            exit 1
          fi
          if [ "${#RELEASE_ADMIN_PASSWORD}" -lt 16 ] \
            || ! [[ "$RELEASE_ADMIN_PASSWORD" =~ [[:lower:]] ]] \
            || ! [[ "$RELEASE_ADMIN_PASSWORD" =~ [[:upper:]] ]] \
            || ! [[ "$RELEASE_ADMIN_PASSWORD" =~ [[:digit:]] ]] \
            || [[ "$RELEASE_ADMIN_PASSWORD" =~ ^[[:alnum:]]+$ ]]; then
            echo "::error::The release administrator password secret does not satisfy the production policy."
            exit 1
          fi
          if ! [[ "$RELEASE_ADMIN_MFA_SECRET" =~ ^[A-Z2-7]{32,64}$ ]]; then
            echo "::error::The release administrator MFA secret must be a 32-64 character Base32 value."
            exit 1
          fi
          IFS=',' read -r -a recovery_codes <<< "$RELEASE_ADMIN_MFA_RECOVERY_CODES"
          if [ "${#recovery_codes[@]}" -ne 8 ]; then
            echo "::error::Exactly eight release administrator recovery codes are required."
            exit 1
          fi
          for recovery_code in "${recovery_codes[@]}"; do
            if ! [[ "$recovery_code" =~ ^[A-F0-9]{10}$ ]]; then
              echo "::error::Release administrator recovery codes must use the expected format."
              exit 1
            fi
          done
          if ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production deployment requires the exact 40-character Git SHA."
            exit 1
          fi

      - name: Validate production legal and mail secrets
        shell: bash
        env:
          PRODUCTION_LEGAL_STATUS: ${{ secrets.YAZOO_PRODUCTION_LEGAL_STATUS }}
          PRODUCTION_LEGAL_ADDRESS: ${{ secrets.YAZOO_PRODUCTION_LEGAL_ADDRESS }}
          PRODUCTION_LEGAL_ICE: ${{ secrets.YAZOO_PRODUCTION_LEGAL_ICE }}
          PRODUCTION_PRIVACY_CONTACT_EMAIL: ${{ secrets.YAZOO_PRODUCTION_PRIVACY_CONTACT_EMAIL }}
          PRODUCTION_CONTACT_RECIPIENT: ${{ secrets.YAZOO_PRODUCTION_CONTACT_RECIPIENT }}
          PRODUCTION_MAIL_HOST: ${{ secrets.YAZOO_PRODUCTION_MAIL_HOST }}
          PRODUCTION_MAIL_PORT: ${{ secrets.YAZOO_PRODUCTION_MAIL_PORT }}
          PRODUCTION_MAIL_USERNAME: ${{ secrets.YAZOO_PRODUCTION_MAIL_USERNAME }}
          PRODUCTION_MAIL_PASSWORD: ${{ secrets.YAZOO_PRODUCTION_MAIL_PASSWORD }}
          PRODUCTION_MAIL_FROM_ADDRESS: ${{ secrets.YAZOO_PRODUCTION_MAIL_FROM_ADDRESS }}
        run: |
          set -euo pipefail
          for secret_name in \
            PRODUCTION_LEGAL_STATUS PRODUCTION_LEGAL_ADDRESS PRODUCTION_LEGAL_ICE \
            PRODUCTION_PRIVACY_CONTACT_EMAIL PRODUCTION_CONTACT_RECIPIENT \
            PRODUCTION_MAIL_HOST PRODUCTION_MAIL_PORT PRODUCTION_MAIL_USERNAME \
            PRODUCTION_MAIL_PASSWORD PRODUCTION_MAIL_FROM_ADDRESS; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::GitHub production secret ${secret_name} is required by the production preflight."
              exit 1
            fi
            if [[ "${!secret_name}" == *$'\n'* || "${!secret_name}" == *$'\r'* ]]; then
              echo "::error::GitHub production secret ${secret_name} must be a single line."
              exit 1
            fi
          done
          for email_name in PRODUCTION_PRIVACY_CONTACT_EMAIL PRODUCTION_CONTACT_RECIPIENT PRODUCTION_MAIL_FROM_ADDRESS; do
            if ! [[ "${!email_name}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
              echo "::error::GitHub production secret ${email_name} must be a valid email address."
              exit 1
            fi
          done
          if ! [[ "$PRODUCTION_MAIL_PORT" =~ ^[0-9]+$ ]] \
            || [ "$PRODUCTION_MAIL_PORT" -lt 1 ] \
            || [ "$PRODUCTION_MAIL_PORT" -gt 65535 ]; then
            echo "::error::YAZOO_PRODUCTION_MAIL_PORT must be between 1 and 65535."
            exit 1
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build immutable images
        run: |
          docker build --build-arg APP_VERSION="${GITHUB_SHA}" -f backend/Dockerfile \
            -t "${BACKEND_IMAGE}" .
          docker build --build-arg APP_VERSION="${GITHUB_SHA}" -f frontend/Dockerfile \
            -t "${FRONTEND_IMAGE}" .

      - name: Smoke-test immutable images before publication
        run: sh scripts/smoke-test-release-images.sh "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}"

      - name: Push immutable SHA images
        run: |
          docker push "${BACKEND_IMAGE}"
          docker push "${FRONTEND_IMAGE}"

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure deployment configuration
        run: |
          set -euo pipefail
          for value in RESOURCE_GROUP BACKEND_WEBAPP FRONTEND_WEBAPP BACKEND_URL FRONTEND_URL MYSQL_SERVER EXPECTED_DB_HOST EXPECTED_DB_PORT EXPECTED_DB_NAME; do
            if [ -z "${!value}" ]; then
              echo "::error::$value is not configured for the production environment."
              exit 1
            fi
          done
          if [ "$EXPECTED_DB_NAME" = "yazoo" ]; then
            echo "::error::DATABASE #1 (yazoo) is protected and cannot be a release target."
            exit 1
          fi

      - name: Require persistent App Service media storage
        run: |
          set -euo pipefail
          storage_enabled="$(az webapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP" \
            --query "[?name=='WEBSITES_ENABLE_APP_SERVICE_STORAGE'].value | [0]" \
            --output tsv)"
          if [ "${storage_enabled,,}" != "true" ]; then
            echo "::error::WEBSITES_ENABLE_APP_SERVICE_STORAGE=true is required before deployment."
            exit 1
          fi

      - name: Validate MySQL backup and restore readiness
        run: |
          set -euo pipefail
          mysql_details="$(az mysql flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MYSQL_SERVER" \
            --only-show-errors \
            --output json)"

          mysql_state="$(printf '%s' "$mysql_details" | jq -r '.state // empty')"
          mysql_host="$(printf '%s' "$mysql_details" | jq -r '.fullyQualifiedDomainName // empty')"
          backup_retention_days="$(printf '%s' "$mysql_details" | jq -r '.backup.backupRetentionDays // .backupRetentionDays // empty')"
          earliest_restore_date="$(printf '%s' "$mysql_details" | jq -r '.backup.earliestRestoreDate // .earliestRestoreDate // empty')"

          if [ "$mysql_state" != "Ready" ]; then
            echo "::error::Azure MySQL server is not Ready."
            exit 1
          fi
          if ! [[ "$backup_retention_days" =~ ^[0-9]+$ ]] || [ "$backup_retention_days" -lt 7 ]; then
            echo "::error::Azure MySQL automated backup retention must be at least 7 days."
            exit 1
          fi
          if [ -z "$earliest_restore_date" ] || [ "$earliest_restore_date" = "null" ]; then
            echo "::error::Azure MySQL earliest point-in-time restore date is unavailable."
            exit 1
          fi
          if [ "${mysql_host,,}" != "${EXPECTED_DB_HOST,,}" ] || [ "$EXPECTED_DB_PORT" != "3306" ]; then
            echo "::error::DATABASE #2 host or port does not match the selected Azure MySQL server."
            exit 1
          fi
          if ! target_database="$(az mysql flexible-server db show \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$MYSQL_SERVER" \
            --database-name "$EXPECTED_DB_NAME" \
            --query name --output tsv --only-show-errors)"; then
            echo "::error::DATABASE #2 does not exist or cannot be inspected."
            exit 1
          fi
          if [ "$target_database" != "$EXPECTED_DB_NAME" ]; then
            echo "::error::DATABASE #2 identity validation failed."
            exit 1
          fi

          echo "Azure MySQL and DATABASE #2 identity are validated; backup and point-in-time restore metadata are available."

      - name: Record previously deployed images
        id: previous
        run: |
          set -euo pipefail
          backend_previous="$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" --query linuxFxVersion -o tsv)"
          frontend_previous="$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_WEBAPP" --query linuxFxVersion -o tsv)"
          backend_previous="${backend_previous#DOCKER|}"
          frontend_previous="${frontend_previous#DOCKER|}"
          backend_version_previous="$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" --query "[?name=='APP_VERSION'].value | [0]" -o tsv)"
          backend_db_host_previous="$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" --query "[?name=='DB_HOST'].value | [0]" -o tsv)"
          backend_db_port_previous="$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" --query "[?name=='DB_PORT'].value | [0]" -o tsv)"
          backend_db_name_previous="$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" --query "[?name=='DB_DATABASE'].value | [0]" -o tsv)"
          test -n "$backend_previous"
          test -n "$frontend_previous"
          {
            echo "backend=$backend_previous"
            echo "frontend=$frontend_previous"
            echo "backend_version=${backend_version_previous:-local}"
            echo "db_host=$backend_db_host_previous"
            echo "db_port=${backend_db_port_previous:-3306}"
            echo "db_name=$backend_db_name_previous"
          } >> "$GITHUB_OUTPUT"

      - name: Enable bounded container deployment diagnostics
        run: |
          az webapp log config --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --docker-container-logging filesystem --output none

      - name: Deploy exact SHA with one locked startup migration
        id: rollout
        continue-on-error: true
        env:
          RELEASE_ADMIN_NAME: ${{ secrets.YAZOO_RELEASE_ADMIN_NAME }}
          RELEASE_ADMIN_EMAIL: ${{ secrets.YAZOO_RELEASE_ADMIN_EMAIL }}
          RELEASE_ADMIN_PASSWORD: ${{ secrets.YAZOO_RELEASE_ADMIN_PASSWORD }}
          RELEASE_ADMIN_MFA_SECRET: ${{ secrets.YAZOO_RELEASE_ADMIN_MFA_SECRET }}
          RELEASE_ADMIN_MFA_RECOVERY_CODES: ${{ secrets.YAZOO_RELEASE_ADMIN_MFA_RECOVERY_CODES }}
          DATABASE2_TEST_ACCOUNT_PASSWORD: ${{ secrets.YAZOO_DATABASE2_TEST_ACCOUNT_PASSWORD }}
          PRODUCTION_LEGAL_STATUS: ${{ secrets.YAZOO_PRODUCTION_LEGAL_STATUS }}
          PRODUCTION_LEGAL_ADDRESS: ${{ secrets.YAZOO_PRODUCTION_LEGAL_ADDRESS }}
          PRODUCTION_LEGAL_ICE: ${{ secrets.YAZOO_PRODUCTION_LEGAL_ICE }}
          PRODUCTION_PRIVACY_CONTACT_EMAIL: ${{ secrets.YAZOO_PRODUCTION_PRIVACY_CONTACT_EMAIL }}
          PRODUCTION_CONTACT_RECIPIENT: ${{ secrets.YAZOO_PRODUCTION_CONTACT_RECIPIENT }}
          PRODUCTION_MAIL_HOST: ${{ secrets.YAZOO_PRODUCTION_MAIL_HOST }}
          PRODUCTION_MAIL_PORT: ${{ secrets.YAZOO_PRODUCTION_MAIL_PORT }}
          PRODUCTION_MAIL_USERNAME: ${{ secrets.YAZOO_PRODUCTION_MAIL_USERNAME }}
          PRODUCTION_MAIL_PASSWORD: ${{ secrets.YAZOO_PRODUCTION_MAIL_PASSWORD }}
          PRODUCTION_MAIL_FROM_ADDRESS: ${{ secrets.YAZOO_PRODUCTION_MAIL_FROM_ADDRESS }}
        run: |
          set -euo pipefail

          wait_backend() {
            for attempt in $(seq 1 20); do
              live_response="$(mktemp)"
              ready_response="$(mktemp)"
              if ! live_code="$(curl --silent --show-error --max-time 10 --output "$live_response" --write-out '%{http_code}' "$BACKEND_URL/health/live")"; then
                live_code="000"
              fi
              if ! ready_code="$(curl --silent --show-error --max-time 10 --output "$ready_response" --write-out '%{http_code}' "$BACKEND_URL/health/ready")"; then
                ready_code="000"
              fi
              backend_live="$(cat "$live_response")"
              backend_ready="$(cat "$ready_response")"
              rm -f "$live_response" "$ready_response"
              if printf '%s' "$backend_live" | grep -Fq "\"version\":\"${GITHUB_SHA}\"" \
                && printf '%s' "$backend_ready" | grep -Fq '"status":"ok"'; then
                return 0
              fi
              echo "Backend health attempt ${attempt}/20: live HTTP ${live_code}, ready HTTP ${ready_code}; expected release is not ready yet."
              sleep 15
            done
            return 1
          }

          az webapp stop --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP"
          az webapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --settings "APP_VERSION=${GITHUB_SHA}" "YAZOO_RUN_PRODUCTION_PREFLIGHT=true" "YAZOO_RUN_MIGRATIONS=true" \
              "YAZOO_RUN_DATABASE2_TEST_DATA_BOOTSTRAP=true" "YAZOO_DATABASE2_TEST_DATA_BOOTSTRAP_ENABLED=true" \
              "YAZOO_DATABASE2_TEST_DATA_BOOTSTRAP_CONFIRMATION=${EXPECTED_DB_HOST}/${EXPECTED_DB_NAME}" \
              "YAZOO_DATABASE2_TEST_ACCOUNT_PASSWORD=${DATABASE2_TEST_ACCOUNT_PASSWORD}" \
              "YAZOO_DATABASE2_TEST_DATA_IMAGES_PATH=/var/www/html/database/seeders/assets/marketplace" \
              "YAZOO_RUN_RELEASE_ADMIN_BOOTSTRAP=true" "YAZOO_RELEASE_ADMIN_BOOTSTRAP_ENABLED=true" \
              "YAZOO_RELEASE_ADMIN_BOOTSTRAP_CONFIRMATION=${EXPECTED_DB_HOST}/${EXPECTED_DB_NAME}" \
              "YAZOO_RELEASE_ADMIN_NAME=${RELEASE_ADMIN_NAME}" "YAZOO_RELEASE_ADMIN_EMAIL=${RELEASE_ADMIN_EMAIL}" \
              "YAZOO_RELEASE_ADMIN_PASSWORD=${RELEASE_ADMIN_PASSWORD}" \
              "YAZOO_RELEASE_ADMIN_MFA_SECRET=${RELEASE_ADMIN_MFA_SECRET}" \
              "YAZOO_RELEASE_ADMIN_MFA_RECOVERY_CODES=${RELEASE_ADMIN_MFA_RECOVERY_CODES}" \
              "LEGAL_STATUS=${PRODUCTION_LEGAL_STATUS}" "LEGAL_ADDRESS=${PRODUCTION_LEGAL_ADDRESS}" \
              "LEGAL_ICE=${PRODUCTION_LEGAL_ICE}" "PRIVACY_CONTACT_EMAIL=${PRODUCTION_PRIVACY_CONTACT_EMAIL}" \
              "CONTACT_RECIPIENT=${PRODUCTION_CONTACT_RECIPIENT}" "MAIL_MAILER=smtp" \
              "MAIL_HOST=${PRODUCTION_MAIL_HOST}" "MAIL_PORT=${PRODUCTION_MAIL_PORT}" \
              "MAIL_USERNAME=${PRODUCTION_MAIL_USERNAME}" "MAIL_PASSWORD=${PRODUCTION_MAIL_PASSWORD}" \
              "MAIL_FROM_ADDRESS=${PRODUCTION_MAIL_FROM_ADDRESS}" "MAIL_FROM_NAME=YaZoo" \
              "YAZOO_RUN_SCHEDULER=true" \
              "DB_HOST=${EXPECTED_DB_HOST}" "DB_PORT=${EXPECTED_DB_PORT}" "DB_DATABASE=${EXPECTED_DB_NAME}" \
              "YAZOO_REQUIRE_EXPECTED_DATABASE=true" "YAZOO_EXPECTED_DB_HOST=${EXPECTED_DB_HOST}" \
              "YAZOO_EXPECTED_DB_PORT=${EXPECTED_DB_PORT}" "YAZOO_EXPECTED_DB_NAME=${EXPECTED_DB_NAME}" \
              "YAZOO_PROTECTED_DB_NAMES=yazoo" --output none
          az webapp config container set --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --docker-custom-image-name "$BACKEND_IMAGE" --docker-registry-server-url https://index.docker.io --output none
          az webapp start --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP"

          if ! wait_backend; then
            echo "::error::Backend migration, health, or SHA verification failed."
            timeout 30s az webapp log tail --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" || true
            exit 1
          fi

          az webapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --settings "APP_VERSION=${GITHUB_SHA}" "YAZOO_RUN_PRODUCTION_PREFLIGHT=true" "YAZOO_RUN_MIGRATIONS=false" \
              "YAZOO_RUN_DATABASE2_TEST_DATA_BOOTSTRAP=false" "YAZOO_DATABASE2_TEST_DATA_BOOTSTRAP_ENABLED=false" \
              "YAZOO_RUN_RELEASE_ADMIN_BOOTSTRAP=false" "YAZOO_RELEASE_ADMIN_BOOTSTRAP_ENABLED=false" --output none
          az webapp config appsettings delete --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --setting-names YAZOO_DATABASE2_TEST_DATA_BOOTSTRAP_CONFIRMATION YAZOO_DATABASE2_TEST_ACCOUNT_PASSWORD \
              YAZOO_RELEASE_ADMIN_BOOTSTRAP_CONFIRMATION YAZOO_RELEASE_ADMIN_NAME \
              YAZOO_RELEASE_ADMIN_EMAIL YAZOO_RELEASE_ADMIN_PASSWORD YAZOO_RELEASE_ADMIN_MFA_SECRET \
              YAZOO_RELEASE_ADMIN_MFA_RECOVERY_CODES --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP"

          if ! wait_backend; then
            echo "::error::Backend failed after disabling startup migrations."
            timeout 30s az webapp log tail --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" || true
            exit 1
          fi

          az webapp config container set --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_WEBAPP" \
            --docker-custom-image-name "$FRONTEND_IMAGE" --docker-registry-server-url https://index.docker.io --output none
          az webapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_WEBAPP" \
            --settings "WEBSITES_PORT=8080" --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_WEBAPP"

          for attempt in $(seq 1 20); do
            version_response="$(mktemp)"
            if ! version_code="$(curl --silent --show-error --max-time 10 --output "$version_response" --write-out '%{http_code}' "$FRONTEND_URL/version.json")"; then
              version_code="000"
            fi
            frontend_version="$(cat "$version_response")"
            rm -f "$version_response"
            if printf '%s' "$frontend_version" | grep -Fq "\"version\":\"${GITHUB_SHA}\""; then
              curl --fail --silent --show-error --max-time 10 --output /dev/null "$FRONTEND_URL/"
              exit 0
            fi
            echo "Frontend version attempt ${attempt}/20: HTTP ${version_code}; expected release is not active yet."
            sleep 15
          done

          echo "::error::The exact SHA failed health or version verification."
          exit 1

      - name: Publish last-known-good aliases
        if: steps.rollout.outcome == 'success'
        run: |
          set -euo pipefail
          docker tag "${BACKEND_IMAGE}" "5eef/yazoo-api:latest"
          docker tag "${FRONTEND_IMAGE}" "5eef/yazoo-frontend:latest"
          docker push "5eef/yazoo-api:latest"
          docker push "5eef/yazoo-frontend:latest"

      - name: Roll back both applications after a failed rollout
        if: steps.rollout.outcome == 'failure'
        id: rollback
        run: |
          set -euo pipefail
          az webapp config appsettings delete --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --setting-names YAZOO_DATABASE2_TEST_DATA_BOOTSTRAP_CONFIRMATION YAZOO_DATABASE2_TEST_ACCOUNT_PASSWORD \
              YAZOO_RELEASE_ADMIN_BOOTSTRAP_CONFIRMATION YAZOO_RELEASE_ADMIN_NAME \
              YAZOO_RELEASE_ADMIN_EMAIL YAZOO_RELEASE_ADMIN_PASSWORD YAZOO_RELEASE_ADMIN_MFA_SECRET \
              YAZOO_RELEASE_ADMIN_MFA_RECOVERY_CODES --output none
          az webapp config container set --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --docker-custom-image-name "${{ steps.previous.outputs.backend }}" --docker-registry-server-url https://index.docker.io --output none
          az webapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP" \
            --settings "APP_VERSION=${{ steps.previous.outputs.backend_version }}" "YAZOO_RUN_PRODUCTION_PREFLIGHT=true" "YAZOO_RUN_MIGRATIONS=false" \
              "YAZOO_RUN_RELEASE_ADMIN_BOOTSTRAP=false" "YAZOO_RELEASE_ADMIN_BOOTSTRAP_ENABLED=false" \
              "YAZOO_RUN_DATABASE2_TEST_DATA_BOOTSTRAP=false" "YAZOO_DATABASE2_TEST_DATA_BOOTSTRAP_ENABLED=false" \
              "DB_HOST=${{ steps.previous.outputs.db_host }}" "DB_PORT=${{ steps.previous.outputs.db_port }}" \
              "DB_DATABASE=${{ steps.previous.outputs.db_name }}" "YAZOO_REQUIRE_EXPECTED_DATABASE=false" --output none
          az webapp config container set --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_WEBAPP" \
            --docker-custom-image-name "${{ steps.previous.outputs.frontend }}" --docker-registry-server-url https://index.docker.io --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$BACKEND_WEBAPP"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_WEBAPP"

          for _attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 --output /dev/null "$BACKEND_URL/health/ready" \
              && curl --fail --silent --show-error --max-time 10 --output /dev/null "$FRONTEND_URL/"; then
              exit 0
            fi
            sleep 15
          done

          echo "::error::Automatic rollback also failed health verification."
          exit 1

      - name: Fail deployment after rollback
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "::error::Deployment failed and rollback was attempted."
          exit 1
